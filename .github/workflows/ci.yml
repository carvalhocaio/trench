name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, Typecheck, Audit and Test
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: trench
      POSTGRES_PASSWORD: trench
      POSTGRES_DB: trench
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trench
          POSTGRES_PASSWORD: trench
          POSTGRES_DB: trench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trench -d trench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # ... checkout, uv, python, sync, lint, format, mypy, audit (unchanged)

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models and migrations are in sync
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest
